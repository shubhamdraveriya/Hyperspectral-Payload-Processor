name: ci

# Python reference models and the ground station decoder run on every push.
# RTL simulation and FPGA builds need Vivado and run locally (tb/run_sim.tcl,
# vivado/build.tcl).
on:
  push:
  pull_request:

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # decoding and reports need only the standard library, model/ and reedsolo
      - run: python -m pytest -q sw/ground
